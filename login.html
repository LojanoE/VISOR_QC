<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Fotos Georreferenciadas - Iniciar Sesión</title>
    <link rel="stylesheet" href="static/css/style.css" />
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
            </div>
            <h1 class="login-title">Visor de Fotos</h1>
            <p class="login-subtitle">Georreferenciadas</p>

            <div id="login-error" class="login-error" style="display:none;"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="login-field">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" autocomplete="username" autofocus required />
                </div>
                <div class="login-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required />
                </div>
                <button type="submit" class="btn btn-primary login-btn" id="login-btn">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script src="static/js/config.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Conectando...';

            const url = (typeof API_BASE !== 'undefined' && API_BASE) ? API_BASE + '/api/login' : '/api/login';
            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            };
            if (typeof API_BASE !== 'undefined' && API_BASE) {
                options.credentials = 'include';
            }

            fetch(url, options)
                .then(resp => resp.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = 'index.html';
                    } else {
                        errorDiv.textContent = data.error || 'Error de autenticación';
                        errorDiv.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = 'Iniciar Sesión';
                    }
                })
                .catch(err => {
                    errorDiv.textContent = 'No se puede conectar al servidor. Verifique que está conectado a la red de la empresa.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                });
        }
    </script>
</body>
</html>
